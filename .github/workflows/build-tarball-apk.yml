name: Build Tarball APK Support

on:
  workflow_dispatch:
  push:
    branches: [feature/tarball-apk-support]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tarball-apk-support

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.0'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Write signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > obtainium-test.keystore

      - name: Write key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../../obtainium-test.keystore
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build signed release APK (normal flavor)
        run: flutter build apk --release --flavor normal

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: obtainium-tarball-signed-apk
          path: build/app/outputs/flutter-apk/app-normal-release.apk

name: Build Tarball APK Support

on:
  workflow_dispatch:
  push:
    branches: [feature/tarball-apk-support]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tarball-apk-support

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.0'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (normal flavor)
        run: flutter build apk --release --flavor normal

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: obtainium-tarball-apk
          path: build/app/outputs/flutter-apk/app-normal-release.apk
